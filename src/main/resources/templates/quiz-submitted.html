<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <img th:src="@{/images/logo.png}" alt="Salesbox AI" class="logo">
    <div class="score-badge" style="padding: 8px 16px; top: 20px; right: 20px;">
        <span class="score-label" style="font-size: 0.65rem; margin-bottom: 2px;">This Quiz</span>
        <span class="score-value" th:text="${score} + '/' + ${totalQuestions}" style="font-size: 1.25rem;"></span>

        <th:block th:if="${hasAttemptedBefore}">
            <div style="border-top: 1px solid rgba(255,255,255,0.1); width: 100%; margin: 6px 0;"></div>

            <span class="score-label" style="font-size: 0.65rem; margin-bottom: 2px;">Prev Score</span>
            <span class="score-value" th:text="${previousScore}"
                style="font-size: 1.25rem; color: var(--accent-purple);"></span>
        </th:block>
    </div>
    <div class="container container--quiz">
        <img th:src="@{/images/quiz-icon.png}" alt="Quiz Icon" class="quiz-icon">
        <h2>Quiz Result</h2>

        <div th:each="res, stat : ${results}" class="question-card">

            <!-- Question -->
            <div class="question-text">
                <span th:text="${stat.index + 1} + '.'"></span>
                <span th:text="${res.question}"></span>
            </div>

            <!-- Options -->
            <div class="options-grid">
                <div th:each="opt : ${res.options.entrySet()}" class="option"
                    th:classappend="${opt.key == res.correctOption} ? ' correct' : (${opt.key == res.userOption} ? ' wrong' : '')">

                    <b th:text="${opt.key} + '.'"></b>
                    <span th:text="${opt.value}"></span>
                </div>
            </div>

            <!-- Result -->
            <div class="result-text">
                <div th:if="${res.userOption == res.correctOption}" class="correct-text">
                    ✔ Correct Answer
                </div>

                <div th:if="${res.userOption != res.correctOption}" class="wrong-text">
                    ✖ Wrong Answer
                    <span style="color: var(--text-muted); margin: 0 10px; font-weight: 300;">|</span>
                    <span style="color: var(--text-muted); font-weight: normal;">Correct: </span>
                    <b th:text="${res.correctOption}" style="color: var(--success-color); margin-left: 5px;"></b>
                </div>
            </div>

        </div>

        <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
            <a href="/select-level" class="btn"
                style="text-decoration: none; max-width: 250px; text-align: center;">Play Again</a>
            <a href="/" class="btn"
                style="text-decoration: none; max-width: 250px; text-align: center; background: transparent; border: 1px solid var(--border-color);">Logout</a>
        </div>

    </div>

</body>

</html>
