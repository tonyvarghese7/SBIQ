<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Preload font for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <img th:src="@{/images/logo.png}" alt="Salesbox AI" class="logo">
    <div class="container">
        <h2>Welcome Back</h2>
        <h3>Login or register to continue</h3>

        <div th:if="${error}" class="error-msg">
            <span th:text="${error}"></span>
        </div>

        <form method="post" action="/login" id="loginForm">
            <div>
                <input type="email" name="email" placeholder="Email address" required autocomplete="username" />
            </div>

            <div style="position: relative;">
                <input type="password" id="password" name="password" placeholder="Password" required
                    autocomplete="current-password" />
            </div>

            <div id="password-criteria" class="password-criteria" style="display: none;">
                <div style="margin-bottom:8px; font-weight:600; font-size: 0.8rem; color: #fff;">Password Requirements
                </div>
                <ul class="criteria-list">
                    <li id="length" class="criteria-item"><span>○</span> 8+ Characters</li>
                    <li id="uppercase" class="criteria-item"><span>○</span> 1 Uppercase</li>
                    <li id="number" class="criteria-item"><span>○</span> 1 Number</li>
                    <li id="special" class="criteria-item"><span>○</span> 1 Special Char</li>
                </ul>
            </div>

            <button type="submit" id="submitBtn">Get Started</button>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const criteriaBox = document.getElementById('password-criteria');
        const submitBtn = document.getElementById('submitBtn');

        const criteria = {
            length: /.{8,}/,
            uppercase: /[A-Z]/,
            number: /[0-9]/,
            special: /[!@#$%^&*(),.?":{}|<>]/
        };

        passwordInput.addEventListener('focus', () => {
            criteriaBox.style.display = 'block';
        });

        // Optional: Hide on blur if valid? Or just keep for clarity. 
        // Let's keep it visible if user has started typing or focused.

        // Disable initially
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';
        submitBtn.style.cursor = 'not-allowed';

        passwordInput.addEventListener('input', function () {
            const val = this.value;
            let allValid = true;

            for (const [id, regex] of Object.entries(criteria)) {
                const el = document.getElementById(id);
                const icon = el.querySelector('span');

                if (regex.test(val)) {
                    el.classList.add('valid');
                    icon.innerText = '✓';
                } else {
                    el.classList.remove('valid');
                    icon.innerText = '○';
                    allValid = false;
                }
            }

            // Enforce client validation to prevent submitting if not fully matching
            submitBtn.disabled = !allValid;
            if(allValid){
                submitBtn.style.opacity = '1';
                submitBtn.style.cursor = 'pointer';
            } else {
                submitBtn.style.opacity = '0.5';
                submitBtn.style.cursor = 'not-allowed';
            }
        });
    </script>

</body>

</html>
