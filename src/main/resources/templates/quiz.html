<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Session - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <img th:src="@{/images/logo.png}" alt="Salesbox AI" class="logo">

    <!-- Timer Badge -->
    <div class="score-badge" th:if="${!allAttempted}"
        style="position: fixed; z-index: 1000; padding: 8px 16px; top: 20px; right: 20px; text-align: center; display: flex; flex-direction: column;">
        <span class="score-label" style="font-size: 0.65rem; margin-bottom: 2px;">Time Left</span>
        <span class="score-value" id="timerDisplay"
            style="font-size: 1.5rem; color: var(--primary-magenta);">20:00</span>
    </div>

    <div class="container container--quiz">
        <img th:src="@{/images/quiz-icon.png}" alt="Quiz Icon" class="quiz-icon">
        <h2>Quiz Session</h2>

        <!-- ✅ Show message if all attempted -->
        <div th:if="${allAttempted}">
            <h3>🎉 You have attempted all the questions! Great job!</h3>
            <p>No more questions available at the moment.</p>
            <a href="/" class="btn">Go Home</a>
        </div>

        <!-- ✅ Show Error if any -->
        <div th:if="${error}" class="error-message">
            <strong th:text="${error}"></strong>
        </div>

        <!-- ✅ Show quiz only if questions exist -->
        <form th:if="${!allAttempted}" method="post" action="/submit-quiz">

            <div th:each="q, iterStat : ${questions}" class="question-card">
                <span class="question-text">
                    <b th:text="${iterStat.index + 1} + '.'"></b>
                    <span th:text="${q.questionText}"></span>
                </span>

                <div class="options-grid">
                    <!-- Option A -->
                    <label class="option-label">
                        <input type="radio" th:name="'answer' + ${iterStat.index + 1}" value="A" required />
                        <span th:text="${q.option1}"></span>
                    </label>

                    <!-- Option B -->
                    <label class="option-label">
                        <input type="radio" th:name="'answer' + ${iterStat.index + 1}" value="B" />
                        <span th:text="${q.option2}"></span>
                    </label>

                    <!-- Option C -->
                    <label class="option-label">
                        <input type="radio" th:name="'answer' + ${iterStat.index + 1}" value="C" />
                        <span th:text="${q.option3}"></span>
                    </label>

                    <!-- Option D -->
                    <label class="option-label">
                        <input type="radio" th:name="'answer' + ${iterStat.index + 1}" value="D" />
                        <span th:text="${q.option4}"></span>
                    </label>
                </div>
            </div>

            <input type="hidden" name="autoSubmit" id="autoSubmit" value="false" />
            <button type="submit">Submit Quiz</button>
        </form>
    </div>

    <!-- Timer Script -->
    <script th:if="${!allAttempted}">
        // 20 minutes in seconds
        let timeLeft = 20 * 60;
        const timerDisplay = document.getElementById('timerDisplay');
        const form = document.querySelector('form');
        const autoSubmitInput = document.getElementById('autoSubmit');

        const updateTimer = () => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.innerText = "0:00";
                autoSubmitInput.value = "true";
                form.submit(); // Auto-submit when time is up
            }
            timeLeft--;
        };

        // Run once immediately, then set interval
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>

</body>

</html>
